- bill_id: s1517
  title: Red Lines Package Omnibus Bill 2026 [No. 2]
  status: Before Senate
  type: Private
  portfolio: null
  originating_house: Senate
  summary: 'Amends the: Defence Trade Controls Act 2012 and Customs Act 1901 to prohibit
    the supply of defence technology, goods or services that could constitute, enable
    or assist a serious violation of international law, including genocide; Future
    Fund Act 2006, Australian Charities and Not-for-profits Commission Act 2012 and
    Superannuation Industry (Supervision) Act 1993 to require the Future Fund, registered
    charities and superannuation entities to divest from certain investments; and
    Public Governance, Performance and Accountability Act 2013 to make consequential
    amendments. Also imposes genocide-risk reporting requirements for certain entities,
    establishes an independent Anti-Genocide Commissioner and prohibits the import
    and sale of goods and services from occupied territories.'
  introducer_name: David Pocock
  introducer_party: Independent
  introducer_id: '11009'
  introducer_division: ACT
