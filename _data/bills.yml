- bill_id: r7559
  title: Domestic Gas Reservation Bill 2026
  status: Before Reps
  type: Government
  portfolio: Industry, Science and Resources
  originating_house: House of Representatives
  summary: 'Introduced with the Domestic Gas Reservation Levy Bill 2026 and Domestic
    Gas Reservation (Consequential Amendments) Bill 2026 to establish a nationally
    consistent domestic gas reservation framework, the bill: establishes an export
    licensing regime under which a person must hold an export licence to export liquefied
    natural gas on and after 1 January 2028; places obligations on export licence
    holders, including to contribute to domestic gas supply through a domestic supply
    obligation (DSO); provides mechanisms to support compliance with the DSO in specified
    circumstances; and provides the Australian Energy Regulator with responsibility
    for administering and enforcing the domestic gas reservation framework.'
