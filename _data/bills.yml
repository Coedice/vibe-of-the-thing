- bill_id: s1436
  title: Whistleblower Protection Authority Bill 2025
  status: Before Senate
  type: Private
  portfolio: null
  originating_house: Senate
  summary: 'The bill: establishes the Whistleblower Protection Authority to receive
    and facilitate the investigation of whistleblower disclosures, provide advice,
    assistance, guidance and support to persons and agencies relating to the making
    of whistleblower disclosures and investigate any mistreatment of whistleblowers
    and undertake enforcement activities; establishes the Whistleblower Protection
    Advisory Council to provide advice to the Whistleblower Protection Commissioner;
    and establishes the Parliamentary Joint Committee on the Whistleblower Protection
    Authority to consider proposed recommendations for the appointment of the commissioner
    and deputy commissioners and to monitor and review the performance of the commissioner.'
  introducer_name: David Pocock
  introducer_party: Independent
  introducer_id: '11009'
  introducer_division: ACT
  pdf_url: https://parlinfo.aph.gov.au/parlInfo/download/legislation/bills/s1436_first-senate/toc_pdf/25S0420.pdf;fileType=application%2Fpdf
  last_updated: 2025-07-23
  second_reading_hansard_url: https://parlinfo.aph.gov.au/parlInfo/search/display/display.w3p;query=Id%3A%22chamber%2Fhansards%2F28693%2F0177%22
- bill_id: s1481
  title: Unlocking Supply of Family Homes Bill 2025
  status: Before Senate
  type: Private
  portfolio: null
  originating_house: Senate
  summary: 'Amends the Income Tax Assessment Act 1997 to: lower the minimum age of
    eligibility for a downsizer contribution from 55 years to 50 years; extend the
    period of time in which a contribution can be made from 90 days to 1 year after
    the change of ownership occurs; and increase the maximum amount of contribution
    from $300,000 to $500,000.'
  introducer_name: Jane Hume
  introducer_party: Liberal
  introducer_id: '10853'
  introducer_division: Victoria
  pdf_url: https://parlinfo.aph.gov.au/parlInfo/download/legislation/bills/s1481_first-senate/toc_pdf/25S3320.pdf;fileType=application%2Fpdf
