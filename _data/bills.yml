  title: Counter-Terrorism Legislation Amendment Bill 2026
  status: Before Senate
  type: Government
  portfolio: Attorney-General
  originating_house: House of Representatives
  summary: 'Amends the: Crimes Act 1914 and Criminal Code Act 1995 to: extend the
    operation of certain counter-terrorism powers and other frameworks for a further
    3 years, until 7 December 2029; and expand information-sharing arrangements; Criminal
    Code Act 1995 to: update the post-sentence order and control order frameworks
