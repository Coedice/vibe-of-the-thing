- bill_id: r7367
  title: Treasury Laws Amendment (Strengthening Financial Systems and Other Measures)
    Bill 2025
  status: Act
  type: Government
  portfolio: Treasury
  originating_house: House of Representatives
  summary: "Amends the: Corporations Act 2001 to expand beneficial ownership disclosure\
    \ obligations that apply to entities listed on Australia\u2019s financial markets\
    \ and broaden the Australian Securities and Investments Commission\u2019s regulatory\
    \ enforcement powers; Australian Charities and Not-for-profits Commission Act\
    \ 2012 to provide for new exceptions for the public disclosure of protected Australian\
    \ Charities and Not-for-profits Commission information about new and ongoing investigations;\
