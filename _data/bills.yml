    2026
  status: Act
  type: Government
  portfolio: Treasury
  originating_house: House of Representatives
  summary: Introduced with the Treasury Laws Amendment (Building a Stronger and Fairer
    Super System) Bill 2026 to reduce the tax concessions available to individuals
    with a total superannuation balance (TSB) exceeding $3 million, the bill imposes
    a tax of 15 per cent on earnings based on the percentage of the TSB exceeding
    the $3 million threshold and a further 10 per cent on earnings based on the percentage
    of the TSB exceeding the $10 million threshold.
