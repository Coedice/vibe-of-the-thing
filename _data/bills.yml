  title: Social Security and Other Legislation Amendment (Technical Changes No. 2)
    Bill 2025
  status: Act
  type: Government
  portfolio: Social Services
  originating_house: House of Representatives
  summary: "Amends the: Social Security Act 1991 to: validate the use of apportioning\
    \ employment income when calculating the rate of a mean-tested social security\
    \ payment for entitlement periods between 1 July 1991 and 6 December 2020; and\
    \ A New Tax System (Family Assistance) (Administration) Act 1999, Paid Parental\
    \ Leave Act 2010, Social Security Act 1991 and Student Assistance Act 1973 to\
    \ expand the special circumstances waiver regimes; provide for a standardised\
    \ and indexed small debt waiver threshold of $250; and provide for a one-off waiver\
    \ of the Commonwealth\u2019s right to recover small undetermined debts. Also establishes\
    \ a resolution scheme to provide a resolution payment to persons whose debts have\
    \ been affected by income apportionment."
