  title: Telecommunications Legislation Amendment (Triple Zero Custodian and Emergency
    Calling Powers) Bill 2025
  status: Act
  type: Government
  portfolio: Infrastructure, Transport, Regional Development, Communications, Sport
    and the Arts
  originating_house: House of Representatives
  summary: "Amends the: Telecommunications (Consumer Protection and Service Standards)\
    \ Act 1999 to establish the Triple Zero Custodian, with the ability to request\
    \ the Australian Communications and Media Authority to require information, or\
    \ direct action, from carriers, carriage service providers and emergency call\
    \ persons in relation to matters which affect the Emergency Call Service; Telecommunications\
    \ Act 1997 to make consequential amendments; and Telecommunications Act 1997 and\
    \ Telecommunications (Consumer Protection and Service Standards) Act 1999 to update\
    \ references to \u2018emergency services\u2019."
  introducer_name: Anika Wells
  introducer_party: Labor
  introducer_id: '10931'
