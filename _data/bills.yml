- bill_id: r7421
  title: Combatting Antisemitism, Hate and Extremism (Firearms and Customs Laws) Bill
    2026
  status: Act
  type: Government
  portfolio: Home Affairs
  originating_house: House of Representatives
  summary: 'Amends the: Customs (Prohibited Exports) Regulations 1958, Customs (Prohibited
    Imports) Regulations 1956 and Customs Regulation 2015 to prohibit the importation
    of violent extremist material and goods depicting or containing prohibited symbols;
    AusCheck Act 2007, Australian Security Intelligence Organisation Act 1979, Australian
    Crime Commission Act 2002 and Crimes Act 1914 to establish a framework to enable
    firearms background checks; Customs Act 1901 to: establish an information sharing
    and disclosure framework to facilitate the automatic disclosure of firearms information
    and other prescribed information; and make technical amendments; Customs (Prohibited
    Imports) Regulations 1956 to: establish a public safety test for firearms and
    weapons; strengthen import controls on certain firearms and firearm-related goods;
    and amend the police certification tests to remove the use of open-ended permits
    for the importation of firearms and weapons; and Criminal Code Act 1995 and Crimes
    Act 1914 to create new offences for using a carriage service to deal with firearms
    and explosives manufacture material or possessing or controlling this material
    through a carriage service. Also establishes a national gun buyback scheme to
    purchase surplus and restricted firearms; and makes consequential amendments to
    10 Acts and 3 regulations.'
  introducer_name: Tony Burke
  introducer_party: Labor
  introducer_id: '10081'
  introducer_division: Watson
  pdf_url: https://parlinfo.aph.gov.au/parlInfo/download/legislation/bills/r7421_aspassed/toc_pdf/26002b01.pdf;fileType=application%2Fpdf
  last_updated: 2026-01-20
  second_reading_hansard_url: https://parlinfo.aph.gov.au/parlInfo/search/display/display.w3p;query=Id%3A%22chamber%2Fhansardr%2F29340%2F0011%22
- bill_id: r7422
  title: Combatting Antisemitism, Hate and Extremism (Criminal and Migration Laws)
    Bill 2026
  status: Act
  type: Government
  portfolio: Attorney-General
  originating_house: House of Representatives
  summary: 'Amends the: Criminal Code Act 1995 to: create aggravated offences for
    preachers and leaders who advocate or threaten force or violence and adults who
    seek to radicalise children; increase penalties for advocating or threatening
    force or violence; introduce a new listing framework for prohibited hate groups;
    and strength the existing prohibited symbols offences; Crimes Act 1914 to introduce
    an aggravated sentencing factor for conduct motivated by racial hatred; Intelligence
    Services Act 2001 to provide for a review by the Parliamentary Joint Committee
    on Intelligence and Security of the operation of the aggravated offences for preachers
    and leaders and the operation of the prohibited hate group framework; Migration
    Act 1958 to insert grounds that specifically address hate-motivated conduct and
    conduct or offences relating to the spread of hatred and extremism; and Migration
    Regulations 1994 to ensure that, if a person is refused a permanent visa on character
    grounds, they are subject to the same exclusion period as a person who has had
    their visa cancelled on character grounds. Also makes consequential amendments
    to 5 Acts.'
  introducer_name: Michelle Rowland
  introducer_party: Labor
  introducer_id: '10751'
  introducer_division: Greenway
  pdf_url: https://parlinfo.aph.gov.au/parlInfo/download/legislation/bills/r7422_aspassed/toc_pdf/26003b01.pdf;fileType=application%2Fpdf
