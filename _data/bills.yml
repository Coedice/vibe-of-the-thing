  title: Criminal Code Amendment (State Sponsors of Terrorism) Bill 2025
  status: Act
  type: Government
  portfolio: Attorney-General
  originating_house: House of Representatives
  summary: 'Amends the Criminal Code Act 1995 to: provide for a framework to list
    foreign state entities as state sponsors of terrorism and to respond to state-sponsored
    terrorist acts; and enable control orders, preventative detention orders and post
    sentence orders to be used in respect of state sponsors of terrorism and state
    terrorist acts. Also makes consequential amendments to 20 Acts.'
