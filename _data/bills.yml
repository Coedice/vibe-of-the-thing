  status: Act
  type: Government
  portfolio: Home Affairs
  originating_house: House of Representatives
  summary: 'Amends the Customs Tariff Act 1995 to: set the general rate of customs
    duty applicable to approximately 500 tariff headings and subheadings to free;
    provide that the preferential rate of customs duty applied to goods covered by
    the Regional Comprehensive Economic Partnership Agreement is not higher than the
    general rate of customs duty; extend for a further 2 years the increase in customs
