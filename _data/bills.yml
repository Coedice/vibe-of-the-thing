- bill_id: r7514
  title: Treasury Laws Amendment (Strengthening Accountability for Tax Adviser Misconduct
    and Other Measures) Bill 2026
  status: Before Reps
  type: Government
  portfolio: Treasury
  originating_house: House of Representatives
  summary: "Amends the: Tax Agent Services Act 2009 to expand the Tax Practitioners\
    \ Board\u2019s regulatory penalty powers; Income Tax Assessment Act 1997, International\
    \ Tax Agreements Act 1953 and Taxation Administration Act 1953 to amend the foreign\
    \ resident capital gains tax (CGT) regime, including by clarifying and broadening\
    \ the foreign resident CGT tax base by introducing a definition of \u2018real\
    \ property\u2019; Income Tax (Transitional Provisions) Act 1997 to provide a transitional\
    \ 50 per cent CGT discount for certain foreign residents who dispose of Australian\
    \ renewable energy assets; Competition and Consumer Act 2010 to amend the operation\
    \ of the mandatory and suspensory merger control regime; Competition and Consumer\
    \ Act 2010 and Productivity Commission Act 1998 to give effect to the National\
    \ Competition Principles (NCP) as contained in the 2024 NCP Agreement; Income\
    \ Tax Assessment Act 1997 to update the list of deductible gift recipients; Anti-Money\
    \ Laundering and Counter-Terrorism Financing Act 2006, Income Tax Assessment Act\
    \ 1997 and Taxation Administration Act 1953 to rename public and private ancillary\
    \ funds as public and private giving funds; and Taxation Administration Act 1953\
    \ to make minor and technical amendments. Also repeals the Taxation Administration\
    \ (Remedial Power\u2014Foreign Resident Capital Gains Withholding) Determination\
    \ 2017."
  introducer_name: Daniel Mulino
  introducer_party: Labor
  introducer_id: '10925'
  introducer_division: Fraser
