  title: Australian Security Intelligence Organisation Amendment Bill (No. 2) 2025
  status: Act
  type: Government
  portfolio: Home Affairs
  originating_house: House of Representatives
  summary: "Amends the: Australian Security Intelligence Organisation Act 1979 to:\
    \ make the Australian Security Intelligence Organisation\u2019s compulsory questioning\
    \ powers framework permanent; expand the scope of adult questioning warrants;\
    \ amend the eligibility and termination provisions for prescribed authorities;\
    \ impose additional reporting requirements to ensure that the Attorney-General\
    \ is made aware of any relevant information regarding the conduct of questioning\
    \ under a compulsory questioning warrant; require that post-charge questioning\
    \ occur only before a prescribed authority who is a retired judge; and Intelligence\
    \ Services Act 2001 to enable a further review of the framework by the Parliamentary\
    \ Joint Committee on Intelligence and Security"
