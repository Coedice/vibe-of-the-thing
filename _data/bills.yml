- bill_id: r7516
  title: Administrative and Judicial Review Legislation Amendment Bill 2026
  status: Before Senate
  type: Government
  portfolio: Attorney-General
  originating_house: House of Representatives
  summary: 'Amends the: Administrative Review Tribunal Act 2024 to: authorise registrars
    to exercise additional powers, including the power to reinstate and dismiss applications;
    enable the correction of obvious errors in orders issued by registrars; clarify
    that the President is assigned to every jurisdictional area; provide for additional
    matters to be considered when appointing non-judicial members and change the basis
    on which non-judicial members are appointed; and expand the class of decisions
    that are treated as intelligence and security decisions; Administrative Review
    Tribunal Act 2024 and Child Support (Registration and Collection) Act 1988 to
    exclude the period from 24 December to 14 January from the calculation of time
    for an original decision-maker to provide certain documents; Taxation Administration
    Act 1953 to prescribe a standardised timeframe for making certain applications
    to the Administrative Review Tribunal (ART) for review; Migration Act 1958 to:
    require applications to the ART for review of certain decisions to be made using
    an approved form; clarify that the ART may permit the examination or cross-examination
    of a person giving evidence before the tribunal; remove the requirement to notify
    the secretary of dismissal decisions in certain reviews; and require identity
    verification for certain matters; and Administrative Review Tribunal Act 2024
    and Migration Act 1958 to enable the ART to give reasons for its decisions orally.'
