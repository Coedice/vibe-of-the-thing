- bill_id: r7501
  title: Universities Accord (Opening the Doors of Opportunity) Bill 2026
  status: Before Senate
  type: Government
  portfolio: Education
  originating_house: House of Representatives
  summary: 'Amends the: Higher Education Support Act 2003 to change the basis of higher
    education funding to a managed growth funding system based on a total number of
    equivalent full-time student load places; and provide for needs-based funding
    grants to higher education providers in relation to specific types of Commonwealth
    supported students, including students from low socioeconomic backgrounds, First
    Nations students and students studying at regional campuses; Universities Accord
    (Australian Tertiary Education Commission) Act 2026 to: make consequential amendments;
    provide a framework for the Australian Tertiary Education Commission (ATEC) to
    exercise its existing function to allocate international student places; and require
    the ATEC to assess a higher education provider against the terms of their mission
    based compact; and Education Services for Overseas Students Act 2000, Ombudsman
    Act 1976 and Tertiary Education Quality and Standards Agency Act 2011 to make
    minor amendments in relation to information management.'
  introducer_name: Jason Clare
  introducer_party: Labor
  introducer_id: '10123'
  introducer_division: Blaxland
  pdf_url: https://parlinfo.aph.gov.au/parlInfo/download/legislation/bills/r7501_third-reps/toc_pdf/26082b01.pdf;fileType=application%2Fpdf
