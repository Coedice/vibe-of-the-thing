  title: Competition and Consumer Amendment (Unfair Trading Practices) Bill 2026
  status: Assent
  type: Government
  portfolio: Treasury
  originating_house: House of Representatives
  summary: 'Amends the Competition and Consumer Act 2010 to: prohibit a person from
    engaging in unfair trading practices in trade or commerce; require a person offering
