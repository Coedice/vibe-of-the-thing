- bill_id: r7515
  title: Social Security and Other Legislation Amendment (Technical Changes No. 2)
    Bill 2026
  status: Before Reps
  type: Government
  portfolio: Social Services
  originating_house: House of Representatives
  summary: 'Amends the: A New Tax System (Family Assistance) Act 1999, A New Tax System
    (Family Assistance) (Administration) Act 1999 and Social Security Act 1991 to:
    enable the automation of advance payments of social security or family assistance
    entitlements; and correct cross-referencing errors; Administrative Review Tribunal
    Act 2024 and A New Tax System (Family Assistance) (Administration) Act 1999 to
    enable the secretary to alter certain social services decisions that undergo review
    at the Administrative Review Tribunal under specific circumstances; A New Tax
    System (Family Assistance) Act 1999 and A New Tax System (Family Assistance) (Administration)
    Act 1999 to clarify the use of pre-issue income data (PIID); Child Support (Assessment)
    Act 1989 in relation to the use of PIID, the automation of provisional adjusted
    taxable income and the delegation of a publishing function; A New Tax System (Family
    Assistance) (Administration) Act 1999 to enable merits review of tax and family
    assistance entitlement debt offsetting decisions; Paid Parental Leave Act 2010
    in relation to the calculation of paid parental leave superannuation contributions
    and employer debts; Social Security (Administration) Act 1999 to make minor amendments
    in relation to the operation of the urgent payment provisions; and Social Security
    and Other Legislation Amendment (Technical Changes No. 2) Act 2025 to clarify
    the operation of review arrangements for decision relating to the Income Apportionment
    Resolution Scheme.'
  introducer_name: Tanya Plibersek
  introducer_party: Labor
  introducer_id: '10513'
  introducer_division: Sydney
