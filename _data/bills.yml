  summary: "Amends: the Insurance Contracts Act 1984 to establish a ban which prohibits\
    \ insurers from using certain information about an individual\u2019s genetic testing\
    \ to inform the offer of life insurance cover, or the terms and conditions of\
    \ the cover that is offered; the Disability Discrimination Act 1992 to align Australia\u2019\
