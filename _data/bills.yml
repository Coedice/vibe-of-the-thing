  summary: 'Introduced with the Australian Centre for Disease Control Bill 2025, the
    bill amends the: Biosecurity Act 2015, National Health Security Act 2007 and National
    Occupational Respiratory Disease Act 2023 to transfer certain powers and functions
    to the Director-General of the Australian Centre for Disease Control; and Freedom
