- bill_id: s1344
  title: Environment Protection and Biodiversity Conservation Amendment (Climate Trigger)
    Bill 2022
  status: Before Senate
  type: Private
  portfolio: null
  originating_house: Senate
  summary: "Amends the Environment Protection and Biodiversity Conservation Act 1999\
    \ to: require actions that would emit between 25,000 to 100,000 tonnes of carbon\
    \ dioxide equivalent scope 1 emissions in any one year to be assessed for approval\
    \ under Part 9 of the Act; require the minister, when approving any such action\
    \ or when considering whether to enter into a conservation agreement, to consider\
    \ Australia\u2019s national carbon budget and greenhouse gas emissions reduction\
    \ targets; require the minister to reject the approval of actions that would emit\
    \ over 100,000 tonnes of carbon dioxide equivalent scope 1 emissions; require\
    \ the Climate Change Authority to develop a national carbon budget to 2050 and\
    \ to annually assess the budget; prohibit the minister, subject to certain exceptions,\
    \ from using alternative approval processes for certain emissions intensive actions;\
    \ and introduce penalties for undertaking certain emissions intensive actions\
    \ without approval if the action has, will have or is likely to have a significant\
    \ impact on the environment."
  introducer_name: Sarah Hanson-Young
  introducer_party: Greens
  introducer_id: '10711'
  introducer_division: SA
  pdf_url: https://parlinfo.aph.gov.au/parlInfo/download/legislation/bills/s1344_first-senate/toc_pdf/22S0820.pdf;fileType=application%2Fpdf
  last_updated: 2025-07-23
  second_reading_hansard_url: https://parlinfo.aph.gov.au/parlInfo/search/display/display.w3p;query=Id%3A%22chamber%2Fhansards%2F25573%2F0111%22
- bill_id: s1361
  title: Electoral Legislation Amendment (Lowering the Voting Age) Bill 2023
  status: Before Senate
  type: Private
  portfolio: null
  originating_house: Senate
  summary: 'Amends the Commonwealth Electoral Act 1918 and Referendum (Machinery Provisions)
    Act 1984 to: lower the minimum voting age in Australian federal elections and
    referenda from 18 to 16 years; provide for 16 and 17 year olds to be included
    in the certified list of voters (but not to be given a penalty notice if they
    do not vote); and provide that an eligible voter, who is not yet on the electoral
    roll or enrolled at their correct address, is able to cast a provisional vote
    on election day.'
