  status: Not Proceeding
  type: Private
  portfolio: null
  originating_house: House of Representatives
  summary: 'Repeals the Climate Change Act 2022, Future Made in Australia (Guarantee
    of Origin) Act 2024, Future Made in Australia (Guarantee of Origin Charges) Act
