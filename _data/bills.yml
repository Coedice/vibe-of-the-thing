- bill_id: r7384
  title: Education Legislation Amendment (Integrity and Other Measures) Bill 2025
  status: Act
  type: Government
  portfolio: Education
  originating_house: House of Representatives
  summary: "Amends the: Education Services for Overseas Students Act 2000 to implement\
    \ measures relating to Australia\u2019s international education sector, including\
    \ in relation to education agents and commissions, the giving of education agent\
    \ information to registered providers, the management of provider applications,\
    \ registration requirements, the automatic cancellation of registration and specified\
    \ courses in certain circumstances, the investigation of offences when considering\
    \ the fit and proper provider test, and internal reviews of reviewable decisions;\
    \ Tertiary Education Quality and Standards Agency Act 2011 to ensure that registered\
    \ providers that are delivering courses outside Australia are authorised by the\
    \ Tertiary Education Quality and Standards Agency; Higher Education Support Act\
    \ 2003 to introduce demand driven Commonwealth supported places for courses of\
    \ study in medicine for eligible First Nations students; and A New Tax System\
    \ (Family Assistance) (Administration) Act 1999 to: expand information gathering\
    \ powers to support the Early Education Service Delivery Prices Project; expand\
    \ authorisations for the handling of protected information; make technical amendments;\
    \ and align the date of effect for decisions relating to the child care subsidy\
