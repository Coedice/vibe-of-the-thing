  title: Crimes and Other Legislation Amendment (Omnibus No. 1) Bill 2026
  status: Act
  type: Government
  portfolio: Attorney-General
  originating_house: House of Representatives
  summary: 'Amends the: Crimes Act 1914 to list Sydney West Airport as a major airport
    for the purpose of enabling the Australian Federal Police to exercise move-on
    and identity-check powers at the airport; Surveillance Devices Act 2004 and Measures
    to Combat Serious and Organised Crimes Act 2001 to ensure law enforcement authorities
