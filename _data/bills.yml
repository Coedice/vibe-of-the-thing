- bill_id: r7380
  title: Regulatory Reform Omnibus Bill 2025
  status: Act
  type: Government
  portfolio: Finance
  originating_house: House of Representatives
  summary: "Amends: 13 Acts to provide for a \u2018tell us once\u2019 approach to\
    \ support the sharing and use of information provided to various government agencies,\
    \ including Services Australia; the A New Tax System (Family Assistance) Act 1999\
    \ and A New Tax System (Family Assistance) (Administration) Act 1999 to amend\
    \ the language used for the Additional Child Care Subsidy (child wellbeing) payment;\
    \ the Health Insurance Act 1973, National Health Act 1953 and Dental Benefits\
    \ Act 2008 to amend regulatory settings around certain health care services; the\
    \ Private Health Insurance Act 2007 to remove the risk of unintentional non-compliance\
