    2026
  status: Before Senate
  type: Government
  portfolio: Health, Disability and Ageing
  originating_house: House of Representatives
  summary: 'Introduced with the Therapeutic Goods (Charges) Amendment Bill 2026, the
    bill amends the Therapeutic Goods Act 1989 to: expand arrangements relating to
    medicines shortages and discontinuations; enable the determination of common biological
    groups to allow similar biologicals to share a single entry in the Australian
    Register of Therapeutic Goods; authorise persons to enter, search and inspect
    clinical trial sites; enable the Medicines Watch List to incorporate other documents
    as in force from time to time; and make consequential and technical amendments'
