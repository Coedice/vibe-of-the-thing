  status: Act
  type: Government
  portfolio: Home Affairs
  originating_house: House of Representatives
  summary: 'Amends the: Migration Act 1958 and Australian Citizenship Act 2007 to:
    enable the Department of Home Affairs, including the Australian Border Force,
    to collect facial images from persons that align with international standards
    and current biometric technology; and validate facial images that were provided
    by a person or collected by the department in the past and any action taken in
    relation to those images; and Australian Citizenship Act 2007 to remove certain
    residency barriers to Australian citizenship for person engaging in activities
    of benefit to Australia.'
