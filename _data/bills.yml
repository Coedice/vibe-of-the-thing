  status: Act
  type: Government
  portfolio: Home Affairs
  originating_house: House of Representatives
  summary: 'Amends the: Customs Act 1901 to: create new offences for importing, possessing
    or conveying illicit tobacco products; enable unlawfully imported tobacco to be
    prescribed as a tier 1 good; extend customs control to tobacco for which duty
    has been refunded; amend seizure, forfeiture, notice and disposal processes for
    illicit tobacco and other goods; and amend the customs licensing regime by imposing
