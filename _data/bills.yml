  title: Electoral Legislation Amendment (Electoral Communications) Bill 2025
  status: Not Proceeding
  type: Private
  portfolio: null
  originating_house: House of Representatives
  summary: "Amends the: Commonwealth Electoral Act 1918 and Referendum (Machinery\
    \ Provisions) Act 1984 to prohibit the authorisation of certain electoral and\
    \ referendum matter that is inaccurate and misleading to a material extent, including\
    \ material that has been modified using digital technology, such as \u2018deepfakes\u2019\
    ; and require electoral and referendum matter that has been created or modified\
    \ using digital technology (including AI) to carry a statement to that effect;\
    \ Commonwealth Electoral Act 1918 to establish an Electoral Communications Panel;\
    \ and Broadcasting Services Act 1992 and Special Broadcasting Service Act 1991\
    \ to remove the \u2018media blackout\u2019 period that prohibits electoral or\
    \ referendum advertising in the last 3 days of voting in an election or referendum."
