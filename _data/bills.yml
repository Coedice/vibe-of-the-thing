    2026
  status: Assent
  type: Government
  portfolio: Treasury
  originating_house: House of Representatives
  summary: "Amends: the Corporations Act 2001 and Commonwealth Registers Act 2020\
    \ to expand the requirements of the Director Identification Number (Director ID)\
    \ regime, including by requiring that Director IDs are provided to the Australian\
    \ Securities and Investment Commission (ASIC) as part of the company registration\
    \ and director information reporting processes; the Corporations Act 2001 and\
