- bill_id: r7487
  title: National Disability Insurance Scheme Amendment (Securing the NDIS for Future
    Generations) Bill 2026
  status: Act
  type: Government
  portfolio: Health, Disability and Ageing
  originating_house: House of Representatives
  summary: "Amends the: National Disability Insurance Scheme Act 2013 in relation\
    \ to the National Disability Insurance Scheme (NDIS) to: define \u2018functional\
    \ capacity\u2019; limit unscheduled plan reassessments; clarify the requirement\
    \ for support needs to be directly related to a participant\u2019s eligible impairments;\
    \ enable the Minister to reduce funding for specified groups of supports; introduce\
    \ plan end dates and renewal processes; refine the framework for assessing \u2018\
    reasonable and necessary\u2019 supports and update principles applying to participants\
    \ and their plans; clarify the definition of permanence by introducing the concept\
    \ of \u2018all appropriate treatment\u2019; require consideration of a participant\u2019\
    s eligibility for other service systems when determining access to the NDIS; expand\
    \ the National Disability Insurance Agency\u2019s powers to identify, investigate\
    \ and respond to fraud and non-compliance and to ensure the integrity of the NDIS;\
    \ amend governance arrangements relating to pricing decisions, indexation of old\
    \ framework plans and the automation of administrative actions; and provide for\
    \ transitional arrangements; Crimes Act 1914 to make a consequential amendment;\
    \ and National Disability Insurance Scheme Act 2013 and National Disability Insurance\
    \ Scheme Amendment (Getting the NDIS Back on Track No. 1) Act 2024 to support\
    \ the implementation of new framework planning arrangements."
  introducer_name: Mark Butler
  introducer_party: Labor
  introducer_id: '10086'
  introducer_division: Hindmarsh
