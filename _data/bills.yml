  title: Interactive Gambling Amendment (Gambling Reform) Bill 2026
  status: Act
  type: Government
  portfolio: Infrastructure, Transport, Regional Development, Communications, Sport
    and the Arts
  originating_house: House of Representatives
  summary: 'Introduced with the National Self-exclusion Register (Cost Recovery Levy)
    Amendment Bill 2026, the bill amends the: Interactive Gambling Act 2001 to: establish
    new restrictions on wagering advertising, including a ban on wagering advertising
    content during live coverage of sports and requirements for online services to
    prevent restricted users from receiving advertising content; expand the framework
    governing the National Self-Exclusion Register (known as BetStop); prohibit online
    keno and foreign matched lotteries; and clarify the definition of trade promotion
    gambling services; Australian Communications and Media Authority Act 2005 and
    Interactive Gambling Act 2001 to impose obligations on financial institutions
    and online services to prevent payments and access to designated interactive gambling
    services. Also makes consequential amendments to 4 Acts and repeals the Broadcasting
    Services (Online Content Service Provider Rules) 2018.'
