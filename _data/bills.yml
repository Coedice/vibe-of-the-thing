- bill_id: r7469
  title: Aviation Consumer Protection Bill 2026
  status: Before Senate
  type: Government
  portfolio: Infrastructure, Transport, Regional Development, Communications, Sport
    and the Arts
  originating_house: House of Representatives
  summary: "Introduced with the Aviation Consumer Protection Levy Bill 2026, Aviation\
    \ Consumer Protection Levy (Collection) Bill 2026 and Aviation Consumer Protection\
    \ (Consequential Amendments and Transitional Provisions) Bill 2026, the bill establishes\
    \ an aviation consumer protection framework which will impose requirements on\
    \ airlines and airport operators relating to the offer and supply of airline and\
    \ airport services and establish a scheme for handling eligible complaints. Also\
    \ establishes the Aircraft Noise Ombudsperson to review an aircraft noise management\
    \ agency\u2019s management of aircraft noise in Australian territory."
  introducer_name: Michael Mccormack
  introducer_party: Nationals
  introducer_id: '10743'
