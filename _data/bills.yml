- bill_id: r7422
  title: Combatting Antisemitism, Hate and Extremism (Criminal and Migration Laws)
    Bill 2026
  status: Act
  type: Government
  portfolio: Attorney-General
  originating_house: House of Representatives
  summary: 'Amends the: Criminal Code Act 1995 to: create aggravated offences for
    preachers and leaders who advocate or threaten force or violence and adults who
    seek to radicalise children; increase penalties for advocating or threatening
    force or violence; introduce a new listing framework for prohibited hate groups;
    and strength the existing prohibited symbols offences; Crimes Act 1914 to introduce
    an aggravated sentencing factor for conduct motivated by racial hatred; Intelligence
    Services Act 2001 to provide for a review by the Parliamentary Joint Committee
    on Intelligence and Security of the operation of the aggravated offences for preachers
    and leaders and the operation of the prohibited hate group framework; Migration
    Act 1958 to insert grounds that specifically address hate-motivated conduct and
    conduct or offences relating to the spread of hatred and extremism; and Migration
    Regulations 1994 to ensure that, if a person is refused a permanent visa on character
    grounds, they are subject to the same exclusion period as a person who has had
    their visa cancelled on character grounds. Also makes consequential amendments
    to 5 Acts.'
  introducer_name: Michelle Rowland
  introducer_party: Labor
  introducer_id: '10751'
  introducer_division: Greenway
