- bill_id: r7436
  title: Treasury Laws Amendment (Financial Reporting System Reform) Bill 2026
  status: Before Senate
  type: Government
  portfolio: Treasury
  originating_house: House of Representatives
  summary: Amends the Australian Securities and Investments Commission Act 2001 to
    merge the Financial Reporting Council, the Australian Accounting Standards Board
    and the Auditing and Assurance Standards Board into a single entity to be known
    as External Reporting Australia, with responsibility for performing core financial
    reporting and sustainability standard-setting functions. Also makes consequential
    amendments to 8 Acts.
  introducer_name: Daniel Mulino
  introducer_party: Labor
  introducer_id: '10925'
  introducer_division: Fraser
