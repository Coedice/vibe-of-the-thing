- bill_id: r7532
  title: Carbon Credits and Other Legislation Amendment (Integrity and Transparency)
    Bill 2026
  status: Before Reps
  type: Government
  portfolio: Climate Change, Energy, the Environment and Water
  originating_house: House of Representatives
  summary: 'Amends the Carbon Credits (Carbon Farming Initiative) Act 2011 in relation
    to the Australian Carbon Credit Unit Scheme (ACCU) by: expanding consent requirements
    for projects on native title and claimed native title land; replacing the Emissions
    Reduction Assurance Committee with the Carbon Abatement Integrity Committee; amending
    arrangements for the purchase of ACCUs on behalf of the Commonwealth, including
    by transferring purchasing responsibilities; creating powers to address critical
    integrity risks associated with ACCU methods; strengthening compliance and enforcement
    frameworks; supporting participation in projects and the development of new emissions
    reduction methods; and streamlining administration and reporting requirements;
    National Greenhouse and Energy Reporting Act 2007 to strengthen the transparency
    and administration of the National Greenhouse and Energy Reporting Scheme, including
    by allowing the regulations to prescribe additional information that may be disclosed;
    and New Vehicle Efficiency Standard Act 2004 to amend certain dates relating to
    the calculation of emissions values and the extinguishment of liabilities.'
