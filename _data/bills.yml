  title: Defence Legislation Amendment (RCDVS Implementation and Related Measures
    No. 2) Bill 2026
  status: Assent
  type: Government
  portfolio: Defence
  originating_house: House of Representatives
  summary: "Amends the: Defence Act 1903 and Military Rehabilitation and Compensation\
    \ Act 2004 to: expand the functions of the Military Rehabilitation and Compensation\
    \ Commission to include supporting the wellbeing, health and safety of members\
    \ of the Australian Defence Force (ADF), veterans and their families; and provide\
    \ for the collection, use and disclosure of information for certain purposes;\
    \ Defence Act 1903 and Freedom of Information Act 1982 to establish a legislative\
    \ basis for Defence health services; Defence Act 1903 to: ensure that benefits\
    \ for former partners of ADF members can continue in the immediate aftermath of\
    \ a separation; support direct engagement between Defence and ADF families; and\
    \ prohibit persons who have been sentenced to a period of imprisonment for a sexual\
    \ offence from joining the ADF, implement a policy of mandatory discharge for\
    \ persons convicted of sexual and other serious offences and consolidate certain\
    \ existing requirements relating to eligibility for service and the early termination\
    \ of service in the ADF; and Defence and Veterans\u2019 Service Commissioner Act\
    \ 2026 to make minor amendments relating to the operation of the Defence and Veterans\u2019\
    \ Service Commission."
