- bill_id: s1503
  title: Protecting Australians from Foreign Terrorist Fighters Bill 2026
  status: Not Proceeding
  type: Private
  portfolio: null
  originating_house: Senate
  summary: 'Amends the: Counter-Terrorism (Temporary Exclusion Orders) Act 2019 to
    enable the Federal Court of Australia to make a foreign terrorist fighter exclusion
    order in certain circumstances; Crimes Act 1914 to require bail authorities to
    treat the protection of the community and national security as paramount considerations
    when granting bail to persons charged with or convicted of terrorism offences;
    Australian Passports Act 2005 to enable the Minister to refuse, cancel or suspend
    an Australian travel document in certain circumstances; and Criminal Code Act
    1995 to make it an offence to organise or facilitate the entry into Australia
    of certain persons.'
  introducer_name: Pauline Hanson
  introducer_party: One Nation
  introducer_id: '10280'
  introducer_division: Queensland
