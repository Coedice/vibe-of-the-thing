- bill_id: r7457
  title: Treasury Laws Amendment (Delivering an Efficient and Trusted Tax System)
    Bill 2026
  status: Before Reps
  type: Government
  portfolio: Treasury
  originating_house: House of Representatives
  summary: "Amends the: Income Tax Assessment Act 1997 to: remove the requirement\
    \ that gifts to deductible gift recipients be valued at $2 or more donor can claim\
    \ a tax deduction; and exclude tobacco and gambling related activities from eligibility\
    \ for the Research and Development Tax Incentive; Income Tax Assessment Act 1936\
    \ to require trustees of closely held trusts to report, in the trust\u2019s income\
    \ tax return, the quoted tax file numbers of beneficiaries who have an entitlement;\
    \ and Australian Securities and Investments Commission Act 2001, Superannuation\
    \ Industry (Supervision) Act 1993 and Treasury Laws Amendment (More Competition,\
    \ Better Prices) Act 2022 to make minor and technical amendments."
  introducer_name: Daniel Mulino
  introducer_party: Labor
  introducer_id: '10925'
  introducer_division: Fraser
  pdf_url: https://parlinfo.aph.gov.au/parlInfo/download/legislation/bills/r7457_first-reps/toc_pdf/26037b01.pdf;fileType=application%2Fpdf
