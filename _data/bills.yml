    it with a mixture-weight approach; Director of Public Prosecutions Act 1983 and
    Proceeds of Crime Act 2002 to: enable decision making where the Director of Public
    Prosecutions has a conflict of interest; and bring a position title in the Office
    of the Commonwealth Director of Public Prosecutions into alignment with state
    and territory offices of public prosecutions; Extradition Act 1988 to: clarify
    aspects of the extradition process; and provide for new powers of entry and use
    of reasonable force for police officers in relation to the execution of arrest
    warrants; and Telecommunications (Interception and Access) Act 1979 to update
    references to reflect changes in relation to Integrity Oversight Victoria.'
