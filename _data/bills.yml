- bill_id: r7449
  title: Crimes and Other Legislation Amendment (Omnibus No. 1) Bill 2026
  status: Before Senate
  type: Government
  portfolio: Attorney-General
  originating_house: House of Representatives
  summary: 'Amends the: Crimes Act 1914 to list Sydney West Airport as a major airport
    for the purpose of enabling the Australian Federal Police to exercise move-on
    and identity-check powers at the airport; Surveillance Devices Act 2004 and Measures
    to Combat Serious and Organised Crimes Act 2001 to ensure law enforcement authorities
    are able to utilise or retain appropriate information gathering powers and warrant
    powers; Criminal Code Act 1995 to: introduce evidentiary certificates in serious
    drug offences proceedings; and amend the evidentiary framework for determining
    drug quantity thresholds by removing the existing purity-based method and replacing
    it with a mixture-weight approach; Director of Public Prosecutions Act 1983 and
    Proceeds of Crime Act 2002 to: enable decision making where the Director of Public
    Prosecutions has a conflict of interest; and bring a position title in the Office
    of the Commonwealth Director of Public Prosecutions into alignment with state
    and territory offices of public prosecutions; Extradition Act 1988 to: clarify
    aspects of the extradition process; and provide for new powers of entry and use
    of reasonable force for police officers in relation to the execution of arrest
    warrants; and Telecommunications (Interception and Access) Act 1979 to update
    references to reflect changes in relation to Integrity Oversight Victoria.'
  introducer_name: Michelle Rowland
  introducer_party: Labor
  introducer_id: '10751'
  introducer_division: Greenway
