- bill_id: r7380
  title: Regulatory Reform Omnibus Bill 2025
  status: Act
  type: Government
  portfolio: Finance
  originating_house: House of Representatives
  summary: "Amends: 13 Acts to provide for a \u2018tell us once\u2019 approach to\
    \ support the sharing and use of information provided to various government agencies,\
    \ including Services Australia; the A New Tax System (Family Assistance) Act 1999\
    \ and A New Tax System (Family Assistance) (Administration) Act 1999 to amend\
    \ the language used for the Additional Child Care Subsidy (child wellbeing) payment;\
    \ the Health Insurance Act 1973, National Health Act 1953 and Dental Benefits\
    \ Act 2008 to amend regulatory settings around certain health care services; the\
    \ Private Health Insurance Act 2007 to remove the risk of unintentional non-compliance\
    \ by a private health insurer due to a rounding technicality; the Marriage Act\
    \ 1961 to allow marriage celebrants to accept digital forms of identity verification;\
    \ the Offshore Petroleum and Greenhouse Gas Storage Act 2006 to enable petroleum\
    \ and environmental regulators to share certain information; the Australian Communications\
    \ and Media Authority Act 2005 and Defence Act 1903 to expand certain delegation\
    \ powers; the National Broadband Network Companies Act 2011 to enable NBN Co mapping\
    \ data to continue to be made publicly available; the Fuel Security Act 2012,\
    \ Petroleum and Other Fuels Reporting Act 2017 and Liquid Fuel Emergency Act 1984\
    \ to enable the Government to respond to potential shortages of critical fuels;\
    \ the Greenhouse and Energy Minimum Standards Act 2012 to include the consideration\
    \ of energy performance; and the Social Security Act 1991, Military Rehabilitation\
    \ and Compensation Act 2004 and Veterans\u2019 Entitlements Act 1986 to: provide\
    \ for consistency in relation to certain social security benefits; and make minor\
    \ or technical amendments. Also repeals the Cockatoo and Schnapper Islands Act\
    \ 1949 and Early Years Quality Fund Special Account Act 2013."
  introducer_name: Jim Chalmers
  introducer_party: Labor
  introducer_id: '10809'
  introducer_division: Rankin
