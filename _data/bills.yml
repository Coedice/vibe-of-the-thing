- bill_id: r7454
  title: Australian Criminal Intelligence Commission Bill 2026
  status: Before Reps
  type: Government
  portfolio: Home Affairs
  originating_house: House of Representatives
  summary: "Introduced with the Australian Criminal Intelligence Commission (National\
    \ Policing Information Charges) Bill 2026, the bill continues in existence the\
    \ Australian Criminal Intelligence Commission as Australia\u2019s national criminal\
    \ intelligence agency with realigned functions and powers to obtain, analyse and\
    \ communicate intelligence relevant to serious and organised crime, provide nationally\
    \ coordinated criminal history check services, prepare and issue criminal intelligence\
    \ assessments and provide advice about crime trends, criminal activity and preventing\
    \ crime."
