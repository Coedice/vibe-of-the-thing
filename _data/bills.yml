  title: Unlocking Supply of Family Homes Bill 2025
  status: Before Senate
  type: Private
  portfolio: null
  originating_house: Senate
  summary: 'Amends the Income Tax Assessment Act 1997 to: lower the minimum age of
    eligibility for a downsizer contribution from 55 years to 50 years; extend the
    period of time in which a contribution can be made from 90 days to 1 year after
    the change of ownership occurs; and increase the maximum amount of contribution
