  title: Early Childhood Education and Care (Strengthening Regulation of Early Education)
    Bill 2025
  status: Act
  type: Government
  portfolio: Education
  originating_house: House of Representatives
  summary: 'Amends the A New Tax System (Family Assistance) (Administration) Act 1999
    to: strengthen powers to take action in relation to child care subsidy (CCS) providers
    based on quality and safety; expand powers to publicise action taken against CCS
    providers; broaden powers of entry to enable authorised persons to enter premises
    without consent and streamline the process for seeking entry under a monitoring
