  title: Telecommunications Legislation Amendment (Strengthening Communications in
    Natural Disasters) Bill 2026
  status: Before Reps
  type: Private
  portfolio: null
  originating_house: House of Representatives
  summary: 'Amends the: Telecommunications Act 1997 to require the Australian Communications
