  status: Assent
  type: Government
  portfolio: Health, Disability and Ageing
  originating_house: House of Representatives
  summary: 'Amends the: Health Insurance Act 1973 to: provide for the automation of
    Medicare provider numbers; remedy minor issues; and amend the Bonded Medical Program
    in relation to repayment of education costs, Medicare benefits and Bonded Medical
    Program rules; Private Health Insurance Act 2007 to ensure the validity of registration
    and claims processes for the Private Health Insurance Rebate Premiums Reduction
    Scheme; Health Insurance Legislation Amendment (Assignment of Medicare Benefits)
