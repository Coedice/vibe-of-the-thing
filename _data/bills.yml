  title: Telecommunications and Other Legislation Amendment Bill 2025
  status: Act
  type: Government
  portfolio: Home Affairs
  originating_house: House of Representatives
  summary: 'Amends the: Surveillance Devices Act 2004 and Telecommunications (Interception
    and Access) Act 1979 to enable the disclosure and use of protected network activity
    warrant information and network activity warrant intercept information in certain
