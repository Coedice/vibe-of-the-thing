name: Update report data

on:
  schedule:
    - cron: '0 7 * * 5' # 19:00 in UTC+10, Fridays
  workflow_dispatch:

jobs:
  update-report-data:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Git
      uses: actions4git/setup-git@v1
    - name: "Set up Python"
      uses: actions/setup-python@v5
      with:
        python-version-file: "pyproject.toml"
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.8.8"
        enable-cache: true
    - name: Update report data
      env:
        OLLAMA_HOST: https://ollama.com
        OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      run: make reports
    - name: Add, commit, and push any changes
      run: git add .; git diff-index --quiet HEAD || git commit -m "Update report data"; git push
